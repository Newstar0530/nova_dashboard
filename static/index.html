<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 背景：極光、網格、星座（fx.js 會加上 canvas） -->
  <div class="space" aria-hidden="true">
    <div class="aurora"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
    <div class="grid-bg"></div>
  </div>
  <div class="cursor-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand"><span class="logo">✦</span><span class="grad-text">Nova</span></div>
    <div class="greeting"><span class="dot"></span><span id="greeting"></span></div>
    <form id="capture" class="capture" autocomplete="off">
      <input id="capture-text" placeholder="快速記錄到 Inbox…（Enter 送出，Shift+Enter 另存成新筆記）">
      <button type="submit">記錄</button>
    </form>
  </header>

  <main class="grid">
    <!-- 左：Obsidian 知識庫 -->
    <section class="panel reveal" id="panel-vault">
      <div class="panel-head">
        <h2 class="bt">知識庫 <span class="eyebrow">Vault</span></h2>
        <span class="muted small" id="vault-name"></span>
      </div>
      <input id="vault-search" class="search" placeholder="搜尋筆記…">
      <div class="tabs">
        <button class="tab active" data-tab="recent">最近</button>
        <button class="tab" data-tab="tree">全部</button>
      </div>
      <div class="list scroll" id="vault-list"></div>
    </section>

    <!-- 中：閱讀區 -->
    <section class="panel reader reveal" id="reader">
      <div class="empty">
        <div class="big">✦</div>
        <p>從左邊選一篇筆記，或從右邊選一封信</p>
      </div>
    </section>

    <!-- 右：郵件 + Notion -->
    <div class="side">
      <section class="panel reveal" id="panel-mail">
        <div class="panel-head">
          <h2 class="bt">郵件 <span class="eyebrow">Mail</span></h2>
          <div class="actions">
            <button class="icon" id="mail-refresh" title="重新整理">⟳</button>
          </div>
        </div>
        <div id="mail-tools" hidden>
          <input id="mail-search" class="search" placeholder="搜尋郵件（支援 Gmail 語法，如 from:教授 has:attachment）">
          <div class="courses" id="mail-schools"></div>
        </div>
        <div id="mail-body" class="scroll"></div>
      </section>

      <section class="panel reveal" id="panel-notion">
        <div class="panel-head">
          <h2 class="bt">課堂筆記 <span class="eyebrow">Notion → Obsidian</span></h2>
          <button class="small-btn" id="notion-sync">同步</button>
        </div>
        <div id="notion-body"></div>
      </section>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script src="/static/fx.js"></script>
</body>
</html>
